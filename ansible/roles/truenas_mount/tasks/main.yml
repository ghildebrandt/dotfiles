---
- name: Install cifs-utils
  become: true
  apt:
    name: cifs-utils
    state: present

- name: Write CIFS credentials file
  become: true
  copy:
    dest: /etc/truenas-certs.creds
    content: |
      username={{ truenas_smb_user }}
      password={{ truenas_smb_pass }}
    mode: "0600"
    owner: root
    group: root

- name: Ensure cert mount point exists
  become: true
  file:
    path: "{{ truenas_cert_mount }}"
    state: directory
    mode: "0755"

- name: Mount TrueNAS certificates share
  become: true
  ansible.builtin.mount:
    path: "{{ truenas_cert_mount }}"
    src: "//{{ truenas_host }}/{{ truenas_share }}"
    fstype: cifs
    opts: "credentials=/etc/truenas-certs.creds,vers=3.0,ro,file_mode=0444,dir_mode=0555"
    state: mounted
